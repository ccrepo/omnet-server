spring.application.name=server
server.port=PORT
spring.datasource.url=jdbc:mysql://host.docker.internal:3306/omnet?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.auto-commit=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.security.user.name=admin
spring.security.user.password=PASSWORD

logging.level.root=LOGLEVEL
logging.level.org.springframework=LOGLEVEL 
logging.level.org.hibernate.SQL=LOGLEVEL
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=LOGLEVEL
logging.level.com.nimbusds.jwt.proc.DefaultJWTProcessor=LOGLEVEL
logging.level.com.nimbusds.jose.proc.DefaultJOSEProcessor=LOGLEVEL
logging.level.com.nimbusds.jose.jwk.source.RemoteJWKSet=LOGLEVEL

